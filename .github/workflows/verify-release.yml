# Checks a released bundle version, publicly, on every bundle-<version> tag.
#
# The maintainer runs the same `tools/verify` before publishing; this is the
# second, public run of the same checks plus the ones that need GitHub:
#
#   1. bundle.sig is a valid signature of bundle.json with keys/release.pub;
#   2. bundle.json lists exactly the files of the version, with their SHA-256;
#   3. every image is pinned by digest;
#   4. SERVER-SIDE.md names every script in scripts/;
#   5. our images (ghcr.io/zaevlad/vpsfocus-*) have a provenance attestation
#      from this repository — and the commit they were built from has the
#      same agent/ or images/caddy/ sources as this tag (build.ps1 and
#      published.txt aside: they record the build, they are not built);
#   6. no secrets in the tree (gitleaks).
#
# A failed run is a red cross on the tag for everyone to see. The tag is
# never moved or deleted: a fix is a new version.
#
# The release key is not here and never will be: CI only checks.
name: verify-release

on:
  push:
    tags:
      - "bundle-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version, e.g. 0.28.0"
        required: true

permissions: {}

env:
  # Bundle versions older than this were released before images were built
  # here; their images have no attestation, and check 5 only warns for them.
  FIRST_ATTESTED: "0.28.0"
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
      packages: read
    steps:
      - name: Which version
        id: which
        env:
          TAG: ${{ github.ref_name }}
          INPUT: ${{ inputs.version }}
        run: |
          version="${INPUT:-${TAG#bundle-}}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::bad bundle version '$version'"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version && format('bundle-{0}', inputs.version) || github.ref }}
          # Full history: check 5 compares this tree with the commit an image
          # was built from.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Signature, inventory, digests, scripts (tools/verify)
        env:
          VERSION: ${{ steps.which.outputs.version }}
        run: go run ./tools/verify -version "$VERSION"

      - name: Images built here, from this code
        env:
          VERSION: ${{ steps.which.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          older() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | head -n1)" = "$1" ]; }
          failed=0
          sed -n -E 's/^[[:space:]]*image:[[:space:]]*(ghcr\.io\/zaevlad\/vpsfocus-[^[:space:]]+)[[:space:]]*$/\1/p' "bundle/$VERSION/docker-compose.yml.tpl" > ours.txt
          if [ ! -s ours.txt ]; then
            echo "::error::no ghcr.io/zaevlad/vpsfocus-* images in bundle/$VERSION/docker-compose.yml.tpl"
            exit 1
          fi
          while IFS= read -r image; do
            name="${image%%@*}"; name="${name%:*}"; digest="${image##*@}"
            case "$name" in
              */vpsfocus-agent) dir=agent ;;
              */vpsfocus-caddy) dir=images/caddy ;;
              *) echo "::error::unknown image $name"; failed=1; continue ;;
            esac
            if ! gh attestation verify "oci://$name@$digest" --repo "$GITHUB_REPOSITORY" --format json > attestation.json 2> attestation.err; then
              if older "$VERSION" "$FIRST_ATTESTED"; then
                echo "::warning::$name@$digest has no attestation (bundle $VERSION predates builds in CI)"
                continue
              fi
              cat attestation.err
              echo "::error::$name@$digest has no valid attestation from $GITHUB_REPOSITORY"
              failed=1
              continue
            fi
            commit=$(jq -r '.[0].verificationResult.signature.certificate.sourceRepositoryDigest // .[0].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit // empty' attestation.json)
            if [ -z "$commit" ] || ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "::error::$name@$digest: build commit '$commit' is not in this repository"
              failed=1
              continue
            fi
            # build.ps1 and published.txt are the maintainer's notes about the
            # build (image tag and resulting digest); they are written after the
            # image is built and never reach the image, so they do not count.
            if ! git diff --quiet "$commit" HEAD -- "$dir" ":(exclude)$dir/build.ps1" ":(exclude)$dir/published.txt"; then
              git diff --stat "$commit" HEAD -- "$dir" ":(exclude)$dir/build.ps1" ":(exclude)$dir/published.txt"
              echo "::error::$name@$digest was built from $dir/ of $commit, which differs from $dir/ in this tag"
              failed=1
              continue
            fi
            echo "$name@$digest: attested, built from $commit, same $dir/ as this tag"
          done < ours.txt
          exit "$failed"

      - name: No secrets in the tree (gitleaks)
        run: docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" dir /repo --no-banner --redact
